<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Menu</title>
<style>
	/* ---------------------------------------------------------------------------
	   The panel runs in the Tauri overlay (WebView2), so this is a current
	   Chromium: flexbox, grid, custom properties and :focus-visible all work.
	   --------------------------------------------------------------------------- */
	*, *::before, *::after { box-sizing: border-box; }

	:root {
		color-scheme: dark;
		--bg: #10141b;
		--chrome: #141922;
		--surface: #171d26;
		--surface-2: #1c232e;
		--surface-3: #242d3a;
		--line: #2b3543;
		--line-soft: #202834;
		--text: #e7ebf2;
		--muted: #97a3b6;
		--dim: #6b788c;
		--accent: #4c9aff;
		--accent-ink: #d8e9ff;
		--accent-soft: rgba(76, 154, 255, .16);
		--danger: #ef5f6b;
		--danger-ink: #ffc2c6;
		--danger-soft: rgba(239, 95, 107, .14);
		--ok: #6cd08f;
		--radius: 10px;
		--radius-sm: 7px;
		--gap: 8px;
	}

	html { height: 100%; }
	body {
		margin: 0;
		min-height: 100%;
		background: var(--bg);
		color: var(--text);
		font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
		-webkit-font-smoothing: antialiased;
	}

	::-webkit-scrollbar { width: 10px; height: 10px; }
	::-webkit-scrollbar-track { background: transparent; }
	::-webkit-scrollbar-thumb { background: #2c3644; border-radius: 6px; border: 2px solid var(--bg); }
	::-webkit-scrollbar-thumb:hover { background: #3b4859; }

	/* ---- title bar ------------------------------------------------------- */
	.titlebar {
		display: flex;
		align-items: center;
		gap: 8px;
		height: 34px;
		padding: 0 6px 0 12px;
		background: #0d1117;
		border-bottom: 1px solid var(--line);
	}
	.title-drag {
		display: flex;
		align-items: center;
		gap: 10px;
		flex: 1;
		min-width: 0;
		height: 100%;
		user-select: none;
	}
	.title-actions { display: flex; align-items: center; gap: 2px; flex: none; }
	.tbtn {
		display: grid;
		place-items: center;
		width: 30px;
		height: 24px;
		padding: 0;
		background: none;
		border: 0;
		border-radius: var(--radius-sm);
		color: var(--muted);
		cursor: pointer;
		transition: background .12s ease, color .12s ease;
	}
	.tbtn:hover { background: var(--surface-3); color: var(--text); }
	.tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	.tbtn.close:hover { background: #b3261e; color: #fff; }
	.tbtn svg { display: block; }

	/* ---- chrome ---------------------------------------------------------- */
	/* The panel is resizable: keep one readable column and centre it when the
	   window is wider than that, instead of stretching text across the screen. */
	:root { --column: 860px; }
	.top {
		position: sticky;
		top: 0;
		z-index: 20;
		background: var(--chrome);
		border-bottom: 1px solid var(--line);
	}
	.brand {
		font-size: 11px;
		font-weight: 700;
		letter-spacing: .14em;
		text-transform: uppercase;
		color: #7cc4ff;
	}
	.info {
		flex: 1;
		min-width: 0;
		color: var(--muted);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.info b { color: var(--text); font-weight: 600; }
	.searchbar {
		display: flex;
		gap: 8px;
		max-width: var(--column);
		margin-inline: auto;
		width: 100%;
		padding: 0 12px 9px;
	}
	#search { flex: 1; }
	#search {
		width: 100%;
		background: var(--surface-2);
		color: var(--text);
		border: 1px solid var(--line);
		border-radius: var(--radius-sm);
		padding: 7px 10px;
		font: inherit;
	}
	#search::placeholder { color: var(--dim); }
	#search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

	.status {
		position: sticky;
		bottom: 0;
		z-index: 20;
		padding: 7px 12px;
		background: var(--chrome);
		border-top: 1px solid var(--line);
		color: var(--ok);
		font-size: 12px;
	}
	.status-inner { display: flex; align-items: center; gap: 8px; max-width: var(--column); margin-inline: auto; }
	.status .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
	.status.err { color: #ff8f8f; }

	/* ---- sections -------------------------------------------------------- */
	main { max-width: var(--column); margin-inline: auto; width: 100%; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
	.sec > h2 {
		display: flex;
		align-items: center;
		gap: 8px;
		margin: 0 0 8px;
		font-size: 11px;
		font-weight: 600;
		letter-spacing: .12em;
		text-transform: uppercase;
		color: var(--dim);
	}
	.sec > h2::before {
		content: "";
		width: 3px;
		height: 12px;
		border-radius: 2px;
		background: var(--accent);
	}
	.sec-items { display: flex; flex-direction: column; gap: var(--gap); }
	.sec.dense .sec-items { gap: 6px; }

	.item {
		display: flex;
		flex-direction: column;
		gap: var(--gap);
		background: var(--surface);
		border: 1px solid var(--line-soft);
		border-radius: var(--radius);
		padding: 11px 12px;
	}
	.sec.dense .item { padding: 8px 10px; }
	.item.group { background: none; border: 0; padding: 0; }
	.group-grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
		gap: var(--gap);
		align-items: start;   /* a tall card must not stretch its neighbour */
	}
	.group-grid.stack { grid-template-columns: 1fr; }   /* one column of cards */
	.item-head { display: flex; align-items: baseline; gap: 8px; }
	.item-head .label { font-weight: 600; }
	.item-head .hint { margin-left: auto; color: var(--dim); font-size: 11px; text-align: right; }

	.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

	/* ---- buttons --------------------------------------------------------- */
	.btn {
		appearance: none;
		background: var(--surface-3);
		color: var(--text);
		border: 1px solid var(--line);
		border-radius: var(--radius-sm);
		padding: 5px 11px;
		font: inherit;
		font-weight: 500;
		cursor: pointer;
		user-select: none;
		white-space: nowrap;
		transition: background .12s ease, border-color .12s ease, color .12s ease, transform .06s ease;
	}
	.btn:hover { background: #2b3543; border-color: #3b4859; }
	.btn:active { transform: translateY(1px); }
	.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
	.btn.danger { background: var(--danger-soft); border-color: #6b2b34; color: var(--danger-ink); }
	.btn.danger:hover { background: rgba(239, 95, 107, .24); }
	.btn.wide { width: 100%; text-align: left; }
	@keyframes sent-flash {
		from { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
		to { border-color: var(--line); box-shadow: none; }
	}
	.btn.sent { animation: sent-flash .9s ease; }

	/* A value option is a plain button that picks an argument - not a state
	   switch, so it stays flat and small. */
	.btn.value { padding: 4px 10px; font-size: 12px; background: var(--surface-2); }
	.btn.value:hover { background: var(--surface-3); }

	/* A toggle is a state switch: one connected control, centred in the card. */
	.seg {
		align-self: center;
		display: inline-flex;
		gap: 2px;
		padding: 2px;
		background: var(--surface-2);
		border: 1px solid var(--line);
		border-radius: var(--radius-sm);
	}
	.seg .btn { background: none; border-color: transparent; border-radius: 5px; padding: 3px 13px; color: var(--muted); }
	.seg .btn:hover { background: var(--surface-3); color: var(--text); }
	.seg .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

	/* ---- inputs ---------------------------------------------------------- */
	input[type=text] {
		background: var(--surface-2);
		color: var(--text);
		border: 1px solid var(--line);
		border-radius: var(--radius-sm);
		padding: 5px 9px;
		font: inherit;
		min-width: 0;
	}
	input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
	input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; flex: none; }
	input.tiny { width: 54px; text-align: center; }
	input.grow { flex: 1 1 120px; }
	input.num { width: 72px; }

	/* ---- lists ----------------------------------------------------------- */
	.list {
		max-height: 190px;
		overflow-y: auto;
		background: var(--surface-2);
		border: 1px solid var(--line-soft);
		border-radius: var(--radius-sm);
	}
	.sec.dense .list { max-height: 130px; }
	/* Rows are real buttons: reachable with Tab, activated with Enter/Space. */
	.list .opt {
		display: flex;
		align-items: center;
		gap: 8px;
		width: 100%;
		padding: 6px 10px;
		background: none;
		border: 0;
		border-bottom: 1px solid var(--line-soft);
		color: inherit;
		font: inherit;
		text-align: left;
		cursor: pointer;
	}
	.list .opt:last-child { border-bottom: 0; }
	.list .opt:hover { background: var(--surface-3); }
	.list .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
	.list .opt.active { background: var(--accent-soft); }
	.list .opt .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.list .opt .id { flex: none; color: var(--dim); font-size: 11px; white-space: nowrap; }
	.list .empty { padding: 10px; color: var(--dim); }

	/* ---- item search results --------------------------------------------- */
	.list table.picks { width: 100%; border-collapse: collapse; }
	.list table.picks tr.pick { cursor: pointer; }
	.list table.picks tr.pick:hover { background: var(--surface-3); }
	.list table.picks tr.pick.active { background: var(--accent-soft); }
	.list table.picks td.nm { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
	.list table.picks td.nm input[type=checkbox] { margin: 0 8px 0 0; vertical-align: middle; }
	.list table.picks td.id { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); width: 1%; white-space: nowrap; text-align: right; color: var(--dim); font-size: 11px; }
	.list table.picks tr.pick.active td.id { color: var(--accent-ink); }

	/* ---- chips ----------------------------------------------------------- */
	.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
	.chip {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		background: var(--surface-3);
		border: 1px solid var(--line);
		border-radius: 999px;
		padding: 2px 10px;
		font-size: 11px;
	}
	.chip .x {
		background: none;
		border: 0;
		padding: 0;
		color: var(--danger);
		font: inherit;
		font-weight: 700;
		line-height: 1;
		cursor: pointer;
	}
	.chip .x:hover { color: #fff; }
	.chip .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

	/* ---- chains and auto actions ----------------------------------------- */
	.chain { display: flex; flex-wrap: wrap; gap: 6px 14px; }
	.chain-item { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
	.chain-item:hover { color: var(--text); }
	.autorow { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
	.autorow:hover { color: var(--text); }
	.dim { color: var(--dim); }

	/* Star: adds the item to the mini strip. */
	.fav {
		flex: none;
		width: 22px;
		height: 22px;
		margin: -3px -4px -3px 2px;
		padding: 0;
		background: none;
		border: 0;
		border-radius: var(--radius-sm);
		color: #4a5a6e;
		font-size: 14px;
		line-height: 1;
		cursor: pointer;
		transition: color .12s ease, background .12s ease;
	}
	.fav:hover { background: var(--surface-3); color: var(--accent); }
	.fav.on { color: #ffc453; }
	.fav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

	/* ---- quests ---------------------------------------------------------- */
	.qline {
		display: flex;
		align-items: center;
		gap: 8px;
		width: 100%;
		padding: 7px 10px;
		background: var(--surface-2);
		border: 0;
		border-bottom: 1px solid var(--line-soft);
		color: inherit;
		font: inherit;
		font-weight: 600;
		text-align: left;
		cursor: pointer;
	}
	.qline:hover { background: var(--surface-3); }
	.qline:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
	.qline .chev { color: var(--accent); transition: transform .15s ease; }
	.qline.open .chev { transform: rotate(90deg); }
	.qline .count { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 11px; }
	.qrow { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 26px; border-bottom: 1px solid var(--line-soft); }
	.qrow:hover { background: var(--surface-2); }
	.qrow .qname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.qrow .qid { flex: none; color: var(--dim); font-size: 11px; }
	.qrow .qbtns { flex: none; display: flex; gap: 4px; }
	.qrow .qbtns .btn { padding: 3px 8px; font-size: 11px; }
	.qnote { padding: 4px 10px 4px 26px; color: var(--dim); font-size: 11px; }

	/* ---- mini mode -------------------------------------------------------- */
	#mini { display: none; }
	body.mini-mode main, body.mini-mode .searchbar { display: none; }
	body.mini-mode #mini {
		display: block;
		padding: 9px 12px 11px;
	}
	.mini-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
	.mini-blocks { display: flex; flex-direction: column; }
	.mini-blocks:empty { display: none; }
	.mini-widget { display: flex; flex-direction: column; gap: 6px; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line-soft); }
	.mini-blocks > .mini-widget:first-child { padding-top: 0; margin-top: 9px; }
	.mini-head { display: flex; align-items: center; gap: 8px; }
	.mini-head .mini-label { min-width: 62px; color: var(--dim); font-size: 11px; }
	.mini-list {
		display: flex;
		flex-direction: column;
		max-height: 78px;          /* two or three rows, then scroll */
		overflow-y: auto;
		background: var(--surface-2);
		border: 1px solid var(--line-soft);
		border-radius: var(--radius-sm);
	}
	.mini-row {
		display: flex;
		align-items: center;
		gap: 8px;
		width: 100%;
		padding: 4px 9px;
		background: none;
		border: 0;
		border-bottom: 1px solid var(--line-soft);
		color: inherit;
		font: inherit;
		font-size: 12px;
		text-align: left;
		cursor: pointer;
	}
	.mini-row:last-child { border-bottom: 0; }
	.mini-row:hover { background: var(--surface-3); }
	.mini-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
	.mini-row.on { background: var(--accent-soft); }
	.mini-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.mini-row .id { flex: none; color: var(--dim); font-size: 11px; }
	.mini-act { padding: 1px 7px; font-size: 10px; }
	.mini-empty { padding: 5px 9px; color: var(--dim); font-size: 11px; }
	.mini-qty { width: 48px; }
	.mini-label { color: var(--dim); font-size: 11px; }
	.logbox { display: flex; flex-direction: column; gap: 6px; }
	.mini-toggle {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		padding: 4px 12px 4px 10px;
		background: var(--surface-2);
		border: 1px solid var(--line);
		border-radius: 999px;
		color: var(--muted);
		font: inherit;
		font-size: 12px;
		cursor: pointer;
		transition: background .12s ease, border-color .12s ease, color .12s ease;
	}
	.mini-toggle:hover { background: var(--surface-3); color: var(--text); }
	.mini-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	.mini-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: #46536a; }
	.mini-toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
	.mini-toggle.on .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
	.mini-opts { display: inline-flex; gap: 4px; }
	.mini-chip { padding: 3px 9px; }

	.preview {
		background: #0d1219;
		border: 1px dashed var(--line);
		border-radius: var(--radius-sm);
		padding: 7px 9px;
		font-family: ui-monospace, Consolas, monospace;
		font-size: 11px;
		color: #cfe3ff;
		word-break: break-all;
	}
	.names { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div class="top">
	<div class="titlebar">
		<div class="title-drag" data-tauri-drag-region="deep">
			<span class="brand">QA</span>
			<span id="info" class="info">loading...</span>
		</div>
		<div class="title-actions">
			<button id="btn-mini" class="tbtn" type="button" title="Mini mode" aria-label="Mini mode">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
					<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h6"/>
				</svg>
			</button>
			<button id="btn-close" class="tbtn close" type="button" title="Close" aria-label="Close">
				<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
					<path d="M4 4l8 8M12 4l-8 8"/>
				</svg>
			</button>
		</div>
	</div>
	<div class="searchbar">
		<input id="search" type="text" placeholder="Search commands (speed, dungeon, crest...)" autocomplete="off" spellcheck="false">
		<button id="btn-reset" class="btn danger" type="button" title="speed 1, nodie off, nocool off, mpfull off, auto revive off">Reset</button>
	</div>
</div>
<main id="sections"></main>
<div id="mini" class="mini"></div>
<div id="status" class="status" role="status" aria-live="polite">
	<span class="status-inner"><span class="dot"></span><span id="status-text">ready</span></span>
</div>

<script>
'use strict';

// ---------- state ----------
const S = {
	cfg: { sections: [], actions: [] },
	dungeons: { dungeons: [] },
	gearsets: { filters: [], sets: [], slotNames: [] },
	zones: [],
	zonesLoaded: false,
	zonesError: null,
	game: {},
	qa: {},            // last sent command -> args, for button state
	mini: false,       // mini mode: a strip of condensed favourites
	selectedItems: [],
	itemLog: { items: [], options: {}, selected: null },   // the item id logger
	favourites: [],   // items pinned to the mini strip
	dungeonNameById: {},
	zoneNameById: {},
	autoControls: [],  // rendered auto-action controls, synced from /state
	quests: { lines: [], loose: [], counts: {} },
	questError: null,
};

// ---------- dom helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);

function el(tag, props = {}, ...children) {
	const node = document.createElement(tag);
	for (const [k, v] of Object.entries(props)) {
		if (v === undefined || v === null) continue;
		if (k === 'class') node.className = v;
		else if (k === 'text') node.textContent = v;
		else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
		else node.setAttribute(k, v);
	}
	for (const child of children.flat()) {
		if (child === undefined || child === null || child === false) continue;
		node.append(child.nodeType ? child : document.createTextNode(String(child)));
	}
	return node;
}

function status(msg, isErr = false) {
	const bar = $('#status');
	$('#status-text').textContent = msg;
	bar.classList.toggle('err', !!isErr);
}

const getJSON = async url => {
	const res = await fetch(url, { headers: { Accept: 'application/json' } });
	if (!res.ok) throw new Error('HTTP ' + res.status);
	return res.json();
};

const stripPrefix = cmd => String(cmd == null ? '' : cmd).replace(/^\/@?/, '');

window.addEventListener('error', e => status('QA menu error: ' + e.message, true));
window.addEventListener('unhandledrejection', e => status('QA menu error: ' + (e.reason && e.reason.message || e.reason), true));

// ---------- overlay window ----------
// The page is served by the mod, but it runs inside the Tauri overlay, which
// hands it window control over IPC. In a plain browser there is no overlay,
// so the window buttons quietly do nothing.
const tauriApi = () => (window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__ : null;

// Mini mode: a strip of condensed favourites, the window shrunk to fit.
const DEFAULT_SIZE = { width: 560, height: 680 };
let fullSize = null;   // the size to go back to when mini mode ends

async function resizeWindow(mini, height) {
	const api = tauriApi();
	if (!api) return;
	const win = api.window.getCurrentWindow();
	try {
		if (mini) {
			if (!fullSize) fullSize = await win.innerSize();
			const scale = await win.scaleFactor();
			await win.setMinSize(new api.window.LogicalSize(320, height));
			await win.setSize(new api.window.LogicalSize(fullSize.width / scale, height));
		} else {
			// Back to the size the window had before mini mode (or the
			// default), never the strip height.
			const size = fullSize || DEFAULT_SIZE;
			await win.setMinSize(new api.window.LogicalSize(420, 480));
			await win.setSize(new api.window.PhysicalSize(size.width, size.height));
			fullSize = null;
		}
	} catch (e) {
		status('Window: ' + e, true);
	}
}

function measureMini() {
	return document.querySelector('.titlebar').offsetHeight
		+ document.getElementById('mini').offsetHeight
		+ document.getElementById('status').offsetHeight + 4;
}

function setMini(on) {
	S.mini = !!on;
	document.body.classList.toggle('mini-mode', S.mini);
	renderMini();
	paintState();

	const miniBtn = document.getElementById('btn-mini');
	miniBtn.title = S.mini ? 'Full mode' : 'Mini mode';
	miniBtn.setAttribute('aria-label', miniBtn.title);

	resizeWindow(S.mini, measureMini());
}

// The strip can grow (a block added, a list with results), so the window is
// re-measured whenever the strip changes.
function applyMiniSize() {
	if (!S.mini) return;
	resizeWindow(true, measureMini());
}

// The mini strip shows the items listed under "mini" in commands.json,
// condensed. One-liners (toggle, options, cmd, input) sit in a row; the
// menu-like ones (dungeons, items, quests, teleport, gearsets) get their own
// compact block, because a menu needs a list, not a button.
function findItem(label) {
	const walk = item => {
		if ((item.label || '') === label) return item;
		for (const child of item.items || []) {
			const hit = walk(child);
			if (hit) return hit;
		}
		return null;
	};
	for (const sec of S.cfg.sections || []) {
		for (const item of sec.items || []) {
			const hit = walk(item);
			if (hit) return hit;
		}
	}
	return null;
}

const MINI_ROWS = 8;   // how many matches a mini list holds (it scrolls)

// Every word of the query has to appear, so "armory priest" finds
// "Sabex Armory - Heal Priest".
function matchesWords(haystack, query) {
	const words = String(query || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
	if (!words.length) return true;
	const text = String(haystack || '').toLowerCase();
	return words.every(w => text.indexOf(w) !== -1);
}

function renderMini() {
	const host = document.getElementById('mini');
	host.textContent = '';

	const inline = el('div', { class: 'mini-inline' });
	const blocks = el('div', { class: 'mini-blocks' });

	for (const label of S.favourites || []) {
		const item = findItem(label);
		if (!item) continue;
		const node = renderMiniItem(item);
		if (!node) continue;
		(node.dataset.block ? blocks : inline).append(node);
	}
	host.append(inline, blocks);
}

function renderMiniItem(item) {
	switch (item.type) {
		case 'toggle': return miniToggle(item);
		case 'options': return miniOptions(item);
		case 'cmd': return miniCmd(item);
		case 'input': return miniInput(item);
		case 'dungeons': return miniDungeons(item);
		case 'items': return miniItems(item);
		case 'quests': return miniQuests(item);
		case 'teleport': return miniTeleport(item);
		case 'gearsets': return miniGearsets(item);
		case 'itemlog': return renderItemLog(null, item);
	}
	return null;   // nothing to fire - better than an empty command
}

// A toggle: one button that flips the state, instead of an on/off pair.
function miniToggle(item) {
	const cmd = stripPrefix(item.cmd);
	const b = el('button', { class: 'mini-toggle', type: 'button', 'data-cmd': cmd },
		el('span', { class: 'dot' }),
		el('span', { text: item.label })
	);
	b.onclick = () => {
		const on = S.qa[cmd] === 'on';
		send(cmd + (on ? ' off' : ' on'), b);
	};
	return b;
}

// A value list: the same chips, just smaller.
function miniOptions(item) {
	const cmd = stripPrefix(item.cmd);
	const row = el('div', { class: 'mini-opts' });
	for (const opt of item.options || []) {
		const b = el('button', { class: 'btn value mini-chip', type: 'button', 'data-cmd': cmd, 'data-args': opt.args, text: opt.label });
		b.onclick = () => send(cmd + ' ' + opt.args, b);
		row.append(b);
	}
	return el('div', { class: 'controls' }, el('span', { class: 'mini-label', text: item.label }), row);
}

// A command: one button, and the chain stays optional next to it.
function miniCmd(item) {
	const wrap = el('div', { class: 'controls' });
	const b = el('button', { class: 'btn', type: 'button', text: item.label });
	b.onclick = async () => {
		await send(stripPrefix(item.cmd), b);
		for (const c of item.chain || []) {
			if (c._checked) await send(stripPrefix(c.cmd), b);
		}
	};
	wrap.append(b);
	for (const c of item.chain || []) {
		const cb = el('input', { type: 'checkbox', 'aria-label': c.label });
		cb.checked = c.defaultOn !== false;
		c._checked = cb.checked;
		cb.onchange = () => { c._checked = cb.checked; };
		wrap.append(el('label', { class: 'chain-item' }, cb, el('span', { text: c.label })));
	}
	return wrap;
}

// A free-text command: a small field and Send.
function miniInput(item) {
	const inp = el('input', { type: 'text', class: 'grow', 'aria-label': item.placeholder || item.label, placeholder: item.placeholder || item.label });
	const b = el('button', { class: 'btn', type: 'button', text: 'Send' });
	const go = () => {
		const v = inp.value.trim();
		if (!v && !item.allowEmpty) return;
		send(item.cmd + (v ? ' ' + v : ''), b);
		inp.value = '';
	};
	inp.onkeydown = e => { if (e.key === 'Enter') go(); };
	b.onclick = go;
	return el('div', { class: 'controls' }, inp, b);
}

// ---------- the menu-like blocks ----------

// A block: a title, a filter field and a short list.
function miniBlock(title, placeholder, onSearch) {
	const wrap = el('div', { class: 'mini-widget' });
	wrap.dataset.block = '1';
	const search = el('input', { type: 'text', class: 'grow', 'aria-label': placeholder, placeholder });
	const list = el('div', { class: 'mini-list' });
	wrap.append(el('div', { class: 'mini-head' }, el('span', { class: 'mini-label', text: title }), search), list);
	search.oninput = () => { onSearch(search.value.trim(), list); applyMiniSize(); };
	return { wrap, list, search };
}

// Dungeons: type a name, click the match, it enters that dungeon.
function miniDungeons(item) {
	const { wrap, list, search } = miniBlock(item.label || 'Dungeons', 'dungeon name...', (term, host) => {
		host.textContent = '';
		let shown = 0;
		for (const d of S.dungeons.dungeons || []) {
			if (!matchesWords(d.name, term)) continue;
			if (++shown > MINI_ROWS) break;
			const row = el('button', { class: 'mini-row', type: 'button' },
				el('span', { class: 'name', text: d.name }),
				el('span', { class: 'id', text: 'contId ' + d.contId })
			);
			row.onclick = () => send('enter_dungeon ' + d.contId + ' 0', row);
			host.append(row);
		}
		if (!shown) host.append(el('div', { class: 'mini-empty', text: 'No match' }));
	});
	search.oninput();
	return wrap;
}

// Items: type a name, click to pick, then Give.
function miniItems(item) {
	const { wrap, list, search } = miniBlock(item.label || 'Item search', 'item name...', () => {});
	const qty = el('input', { type: 'text', class: 'mini-qty', 'aria-label': 'Quantity', value: '1' });
	const give = el('button', { class: 'btn', type: 'button', text: 'Give' });
	give.onclick = () => {
		if (!S.selectedItems.length) return status('No items selected', true);
		send('makeitems ' + S.selectedItems.join(' ') + ' ' + (qty.value || '1'), give);
	};
	const clear = el('button', { class: 'btn', type: 'button', text: 'Clear' });
	clear.onclick = () => {
		// Drops every picked item, in the list and in the shared selection.
		S.selectedItems = [];
		paint();
	};
	wrap.append(el('div', { class: 'mini-head' }, el('span', { class: 'mini-label', text: 'Give' }), qty, give, clear));

	let results = [];
	const paint = () => {
		list.textContent = '';
		for (const it of results.slice(0, MINI_ROWS)) {
			const on = S.selectedItems.indexOf(it.id) !== -1;
			const row = el('button', { class: 'mini-row' + (on ? ' on' : ''), type: 'button' },
				el('span', { class: 'name', text: it.name }),
				el('span', { class: 'id', text: String(it.id) })
			);
			row.onclick = () => {
				const at = S.selectedItems.indexOf(it.id);
				if (at === -1) S.selectedItems.push(it.id);
				else S.selectedItems.splice(at, 1);
				paint();
			};
			list.append(row);
		}
		if (!results.length) list.append(el('div', { class: 'mini-empty', text: 'Type at least 2 letters' }));
	};
	let timer = null;
	search.oninput = () => {
		const term = search.value.trim();
		clearTimeout(timer);
		if (term.length < 2) { results = []; paint(); return; }
		timer = setTimeout(async () => {
			try {
				results = await getJSON('/items?q=' + encodeURIComponent(term)) || [];
			} catch (e) { results = []; }
			paint();
			applyMiniSize();
		}, 250);
	};
	paint();
	return wrap;
}

// Quests: type a name, then Start or Next step on the quest.
function miniQuests(item) {
	const { wrap, list, search } = miniBlock(item.label || 'Questing', 'quest name...', (term, host) => {
		host.textContent = '';
		if (!term) {
			host.append(el('div', { class: 'mini-empty', text: S.questError ? 'Quest data unavailable' : 'Type a quest name' }));
			return;
		}
		const hits = [];
		for (const line of S.quests.lines || []) {
			for (const qst of line.quests) {
				if (matchesWords(qst.name, term)) hits.push(qst);
				if (hits.length > 200) break;
			}
		}
		for (const qst of S.quests.loose || []) {
			if (matchesWords(qst.name, term)) hits.push(qst);
		}
		if (!hits.length) {
			host.append(el('div', { class: 'mini-empty', text: 'No quest matches' }));
			return;
		}
		for (const qst of hits.slice(0, MINI_ROWS)) {
			const start = el('button', { class: 'btn mini-act', type: 'button', text: 'S', title: 'Start quest ' + qst.id });
			start.onclick = () => send('start_quest ' + qst.id, start);
			const next = el('button', { class: 'btn mini-act', type: 'button', text: 'N', title: 'Next step ' + qst.id });
			next.onclick = () => send('next_task ' + qst.id, next);
			host.append(el('div', { class: 'mini-row' },
				el('span', { class: 'name', text: qst.name }),
				el('span', { class: 'id', text: String(qst.id) }),
				start, next
			));
		}
	});
	search.oninput();
	return wrap;
}

// Teleport: type a zone, click it, it teleports there.
function miniTeleport(item) {
	const { wrap, list, search } = miniBlock(item.label || 'Teleport', 'zone name or id...', (term, host) => {
		host.textContent = '';
		let shown = 0;
		for (const z of S.zones) {
			const nm = zoneName(z);
			if (!matchesWords(nm, term) && String(z.id).indexOf(term) === -1) continue;
			if (++shown > MINI_ROWS) break;
			const row = el('button', { class: 'mini-row', type: 'button' },
				el('span', { class: 'name', text: nm || ('zone ' + z.id) }),
				el('span', { class: 'id', text: String(z.id) })
			);
			row.onclick = () => send('teleport ' + z.id + ' 0 0 0', row);
			host.append(row);
		}
		if (!shown) host.append(el('div', { class: 'mini-empty', text: S.zonesLoaded ? 'No match' : 'Loading zones...' }));
	});
	search.oninput();
	return wrap;
}

// Gear sets: click a set to wear it.
function miniGearsets(item) {
	const { wrap, list, search } = miniBlock(item.label || 'Gear sets', 'gear set name...', (term, host) => {
		host.textContent = '';
		let shown = 0;
		for (const s of S.gearsets.sets || []) {
			// Word-wise: "armory priest" finds "Sabex Armory - Heal Priest".
			if (!matchesWords(s.name, term)) continue;
			if (++shown > MINI_ROWS) break;
			const row = el('button', { class: 'mini-row', type: 'button' },
				el('span', { class: 'name', text: s.name }),
				el('span', { class: 'id', text: s.items.length + ' items' })
			);
			row.onclick = () => send('makeitems ' + s.items.join(' ') + ' 1', row);
			host.append(row);
		}
		if (!shown) host.append(el('div', { class: 'mini-empty', text: 'No match' }));
	});
	search.oninput();
	return wrap;
}

// ---------- sending ----------
function flash(btn) {
	if (!btn) return;
	btn.classList.remove('sent');
	void btn.offsetWidth;   // restart the animation
	btn.classList.add('sent');
	setTimeout(() => btn.classList.remove('sent'), 900);
}

// Remember what we last sent so toggle/preset buttons can show their state.
function noteSent(cmdString) {
	const parts = String(cmdString).split(' ');
	const name = parts.shift();
	S.qa[name] = parts.join(' ');
	paintState();
}

async function send(cmd, btn) {
	if (!String(cmd || '').trim()) return status('Nothing to send', true);
	flash(btn);
	try {
		const r = await getJSON('/run?cmd=' + encodeURIComponent(cmd));
		if (r.ok) {
			noteSent(r.sent);
			status('Sent: ' + r.sent);
		} else {
			status('Error: ' + r.error, true);
		}
	} catch (e) {
		status('Failed: ' + e.message, true);
	}
}

async function doAction(id) {
	try {
		const r = await getJSON('/action?id=' + encodeURIComponent(id));
		if (r.ok) {
			(r.sent || []).forEach(noteSent);
			status('Reset: ' + r.sent.join(', '));
		} else {
			status('Error: ' + r.error, true);
		}
		return r;
	} catch (e) {
		status('Failed: ' + e.message, true);
		return null;
	}
}

// Copy the auto-action state (auto revive) into the rendered controls.
function syncAuto(auto) {
	for (const ac of S.autoControls) {
		const st = (auto || {})[ac.command];
		if (!st) continue;
		ac.cb.checked = !!st.enabled;
		if (document.activeElement !== ac.num) ac.num.value = String(st.seconds);
	}
}

// The star on an item adds it to the mini strip. The list lives on the mod
// side (favourites.json), so it survives restarts and is shared with the
// overlay.
function favButton(label) {
	const b = el('button', {
		class: 'fav', type: 'button', 'data-label': label,
		'aria-label': 'Add ' + label + ' to mini mode',
		text: '☆'
	});
	b.onclick = async () => {
		try {
			const r = await getJSON('/favourites/toggle?label=' + encodeURIComponent(label));
			if (!r.ok) return status('Favourite failed: ' + (r.error || 'unknown'), true);
			S.favourites = r.items || [];
			paintState();
			renderMini();
			applyMiniSize();
			status((S.favourites.indexOf(label) !== -1 ? 'Added to mini: ' : 'Removed from mini: ') + label);
		} catch (e) {
			status('Favourite failed: ' + e.message, true);
		}
	};
	return b;
}

// Highlight the button matching what we last sent, per command group.
function paintState() {
	document.querySelectorAll('button[data-cmd]').forEach(b => {
		const want = S.qa[b.dataset.cmd];
		b.classList.toggle('active', want !== undefined && want === (b.dataset.args ?? ''));
	});
	// The mini toggles show the state instead of an on/off pair.
	document.querySelectorAll('.mini-toggle[data-cmd]').forEach(b => {
		const on = S.qa[b.dataset.cmd] === 'on';
		b.classList.toggle('on', on);
		b.title = b.dataset.cmd + ': ' + (on ? 'on' : 'off');
	});
	// Stars show what is in the mini strip.
	document.querySelectorAll('.fav').forEach(b => {
		const on = (S.favourites || []).indexOf(b.dataset.label) !== -1;
		b.classList.toggle('on', on);
		b.textContent = on ? '★' : '☆';
		b.title = on ? 'In mini mode - click to remove' : 'Add to mini mode';
		b.setAttribute('aria-label', (on ? 'Remove ' : 'Add ') + b.dataset.label + (on ? ' from' : ' to') + ' mini mode');
	});
}

// ---------- loading ----------
async function loadAll() {
	try {
		S.cfg = await getJSON('/commands');
	} catch (e) {
		status('Could not load commands.json: ' + e.message, true);
		return;
	}

	const [dungeons, gearsets, quests, zones, favourites] = await Promise.all([
		getJSON('/dungeons').catch(() => null),
		getJSON('/gearsets').catch(() => null),
		getJSON('/quests').catch(() => null),
		getJSON('/zones').catch(() => null),
		getJSON('/favourites').catch(() => null),
	]);

	if (favourites && Array.isArray(favourites.items)) S.favourites = favourites.items;

	if (dungeons) S.dungeons = dungeons;
	(S.dungeons.dungeons || []).forEach(dn => { S.dungeonNameById[dn.contId] = dn.name; });

	if (gearsets) S.gearsets = gearsets;

	if (quests) {
		if (quests.index) S.quests = quests.index;
		S.questError = quests.error || null;
	}

	if (zones) {
		S.zones = (zones.zones || []).sort((a, b) =>
			(zoneName(a) || String(a.id)).localeCompare(zoneName(b) || String(b.id)));
		S.zonesError = zones.error ? String(zones.error) : null;
		S.zonesLoaded = true;
		S.zones.forEach(zn => { if (zn.name) S.zoneNameById[zn.id] = zn.name; });
	}

	render();
	renderMini();
}

async function pollItemLog() {
	if (!paintItemLog) return;   // no logger on the panel
	try {
		const r = await getJSON('/items/log');
		S.itemLog.items = r.items || [];
		S.itemLog.options = r.options || {};
		paintItemLog();
	} catch (e) { /* the mod may be reloading */ }
}

async function pollState() {
	try {
		S.game = await getJSON('/state');
	} catch (e) {
		return;
	}
	const s = S.game;
	const zone = s.zone ? (S.dungeonNameById[s.zone] || S.zoneNameById[s.zone] || '') : '';

	// Keep auto-action controls in sync with the mod's state.
	syncAuto(s.auto);

	const info = $('#info');
	info.textContent = '';
	if (!s.inGame) {
		info.textContent = 'not in game';
		return;
	}
	info.append(
		el('b', { text: s.char || '?' }),
		' lv' + s.level,
		' | zone ',
		el('b', { text: String(s.zone) }),
		zone,
		s.inDungeon ? ' (dungeon)' : ''
	);
}

// ---------- rendering ----------
function render() {
	const host = $('#sections');
	host.textContent = '';
	S.autoControls = [];   // re-render replaces the DOM, so drop stale references

	for (const sec of S.cfg.sections || []) {
		const wrap = el('section', { class: 'sec' + (sec.dense ? ' dense' : '') });
		wrap.append(el('h2', { text: sec.title || '' }));
		const items = el('div', { class: 'sec-items' });
		for (const item of sec.items || []) items.append(renderItem(item));
		wrap.append(items);
		host.append(wrap);
	}

	$('#btn-reset').onclick = resetAll;
	paintState();
}

function renderItem(item) {
	const isGroup = item.type === 'group';
	const box = el('div', {
		class: 'item' + (isGroup ? ' group' : ''),
		'data-search': isGroup ? null
			: ((item.label || '') + ' ' + (item.cmd || '') + ' ' + (item.type || '') + ' ' + (item.hint || '')).toLowerCase(),
	});

	if (item.label || item.hint) {
		const head = el('div', { class: 'item-head' });
		head.append(el('span', { class: 'label', text: item.label || item.cmd || '' }));
		if (item.hint) head.append(el('span', { class: 'hint', text: item.hint }));
		if (item.label) head.append(favButton(item.label));
		box.append(head);
	}

	switch (item.type) {
		case 'cmd': renderCmd(box, item); break;
		case 'options': renderOptions(box, item); break;
		case 'toggle': renderToggle(box, item); break;
		case 'input': renderInput(box, item); break;
		case 'teleport': renderTeleport(box, item); break;
		case 'dungeons': renderDungeons(box); break;
		case 'items': renderItemSearch(box); break;
		case 'gearsets': renderGearsets(box); break;
		case 'itemlog': renderItemLog(box, item); break;
		case 'group': renderGroup(box, item); break;
		case 'quests': renderQuests(box); break;
	}
	return box;
}

// A group lays its children out side-by-side instead of stacking them.
function renderGroup(box, item) {
	const kids = item.items || [];
	const grid = el('div', { class: 'group-grid' + (item.layout === 'column' ? ' stack' : '') });
	for (const child of kids) grid.append(renderItem(child));
	box.append(grid);
}

function renderCmd(box, item) {
	const btn = el('button', { class: 'btn wide', type: 'button', text: item.label });
	btn.onclick = async () => {
		// Fire the main command, then each checked chain command in order.
		await send(stripPrefix(item.cmd), btn);
		for (const c of item.chain || []) {
			if (c._checked) await send(stripPrefix(c.cmd), btn);
		}
	};
	box.append(btn);

	if (item.chain && item.chain.length) {
		const chain = el('div', { class: 'chain' });
		for (const c of item.chain) {
			const cb = el('input', { type: 'checkbox' });
			cb.checked = c.defaultOn !== false;
			c._checked = cb.checked;
			cb.onchange = () => { c._checked = cb.checked; };
			chain.append(el('label', { class: 'chain-item' }, cb, el('span', { text: c.label })));
		}
		box.append(chain);
	}

	if (item.auto) box.append(renderAuto(item.auto));
}

// Auto action: a checkbox + small seconds box that makes the mod fire this
// command N seconds after death. State is owned by the mod (it survives page
// reloads and mod reloads); this control just reads and pushes it.
function renderAuto(auto) {
	const cmd = stripPrefix(auto.cmd);
	const st = (S.game.auto && S.game.auto[cmd]) || {};

	const cb = el('input', { type: 'checkbox' });
	cb.checked = !!st.enabled;

	const num = el('input', { type: 'text', class: 'tiny' });
	num.value = String(st.seconds !== undefined ? st.seconds : (auto.defaultSeconds || 5));

	const push = async () => {
		try {
			const r = await getJSON('/auto?cmd=' + encodeURIComponent(cmd)
				+ '&enabled=' + (cb.checked ? 1 : 0)
				+ '&seconds=' + encodeURIComponent(num.value));
			cb.checked = !!r.action.enabled;
			num.value = String(r.action.seconds);
			status('Auto ' + cmd + ': ' + (r.action.enabled ? 'on, ' + r.action.seconds + 's' : 'off'));
		} catch (e) {
			status('Auto setting failed', true);
		}
	};
	cb.onchange = push;
	num.onchange = push;
	num.onkeydown = e => { if (e.key === 'Enter') push(); };

	S.autoControls.push({ command: cmd, cb, num });
	return el('label', { class: 'autorow' },
		cb,
		el('span', { text: (auto.label || 'Auto') + ' after' }),
		num,
		el('span', { class: 'dim', text: 's' })
	);
}

// ---------- teleport to an arbitrary zone ----------
function renderTeleport(box, item) {
	const search = el('input', { type: 'text', class: 'grow', 'aria-label': 'Zone name or id', placeholder: 'zone name or id' });
	box.append(el('div', { class: 'controls' }, search));

	const list = el('div', { class: 'list' });
	box.append(list);

	const ax = numInput('x', 'X coordinate'), ay = numInput('y', 'Y coordinate'), az = numInput('z', 'Z coordinate');
	const grab = el('button', { class: 'btn', type: 'button', text: 'My position' });
	grab.onclick = () => {
		const l = S.game.loc;
		if (!l) return status('Position unknown - move a little', true);
		ax.value = String(Math.round(l.x));
		ay.value = String(Math.round(l.y));
		az.value = String(Math.round(l.z));
	};
	const here = el('button', { class: 'btn', type: 'button', text: 'This zone' });
	here.onclick = () => {
		if (!S.game.zone) return status('No current zone', true);
		pickedZone = S.game.zone;
		search.value = ((S.dungeonNameById[S.game.zone] || S.zoneNameById[S.game.zone]) ? (S.dungeonNameById[S.game.zone] || S.zoneNameById[S.game.zone]) + ' ' : '') + S.game.zone;
		paint();
	};
	box.append(el('div', { class: 'controls' }, ax, ay, az, grab, here));

	const sendBtn = el('button', { class: 'btn', type: 'button', text: 'Teleport' });
	sendBtn.onclick = () => {
		const id = resolveZone();
		if (id === null) return status('Pick a zone from the list, or type its id', true);
		send('teleport ' + id + ' ' + (ax.value || 0) + ' ' + (ay.value || 0) + ' ' + (az.value || 0), sendBtn);
	};
	box.append(el('div', { class: 'controls' }, sendBtn));

	let pickedZone = null;

	// A bare number typed in the box always wins; otherwise use the clicked zone.
	function resolveZone() {
		const t = search.value.replace(/\s+/g, '');
		if (/^\d+$/.test(t)) return t;
		return pickedZone;
	}

	function paint() {
		const q = search.value.trim().toLowerCase();
		list.textContent = '';
		let shown = 0;
		const rows = S.zones.length ? S.zones : dungeonFallback();
		for (const z of rows) {
			const nm = zoneName(z) || z.name || '';
			if (q && nm.toLowerCase().indexOf(q) === -1 && String(z.id).indexOf(q) === -1) continue;
			if (++shown > 60) continue;
			const opt = el('button', { class: 'opt' + (pickedZone === z.id ? ' active' : ''), type: 'button' },
				el('span', { class: 'name', text: (nm ? nm : 'zone ' + z.id) + ' - ' + z.id }),
				el('span', { class: 'id', text: z.channelType || (z.note ? 'dungeon' : '') })
			);
			opt.onclick = () => {
				pickedZone = z.id;
				search.value = (nm ? nm + ' ' : '') + z.id;
				paint();
				status('Zone ' + z.id + ' picked - set coordinates, then Teleport');
			};
			list.append(opt);
		}
		if (!shown) {
			list.append(el('div', { class: 'empty', text: !S.zonesLoaded ? 'Loading zones...'
				: (S.zonesError ? 'Zone list failed: ' + S.zonesError + ' - type a zone id.'
					: 'No match - type a zone id directly.') }));
		}
	}

	// Dungeon ids are a guaranteed-available fallback if the DataCenter query
	// did not return anything.
	function dungeonFallback() {
		return (S.dungeons.dungeons || []).map(d => ({
			id: d.contId, name: d.name, note: d.note, channelType: 'dungeon'
		}));
	}

	search.oninput = () => {
		// If the box no longer mentions the picked zone, treat it as unselected
		// so a stale id can never be teleported to by accident.
		if (pickedZone !== null && search.value.indexOf(String(pickedZone)) === -1) pickedZone = null;
		paint();
	};
	paint();
}

function numInput(ph, label) {
	return el('input', { type: 'text', class: 'num', 'aria-label': label || ph, placeholder: ph });
}

function zoneName(z) {
	if (!z) return '';
	// dungeons.json (your sheet) first: the DataCenter keeps dev placeholder
	// names for some dungeons, and lacks 8 of yours.
	if (S.dungeonNameById[z.id]) return S.dungeonNameById[z.id];
	if (S.zoneNameById[z.id]) return S.zoneNameById[z.id];
	for (const key of ['name', 'zoneName', 'mapName', 'string', 'title', 'desc']) {
		if (typeof z[key] === 'string' && z[key]) return z[key];
	}
	return '';
}

// ---------- dungeons ----------
function renderDungeons(box) {
	const search = el('input', { type: 'text', class: 'grow', 'aria-label': 'Filter dungeons', placeholder: 'Filter ' + (S.dungeons.dungeons || []).length + ' dungeons...' });
	const idx = el('input', { type: 'text', class: 'num', title: 'enter-index', 'aria-label': 'Enter index', value: '0' });
	box.append(el('div', { class: 'controls' }, search, idx));

	const list = el('div', { class: 'list' });
	box.append(list);

	const nameInp = el('input', { type: 'text', class: 'grow', 'aria-label': 'Name for the current zone', placeholder: 'Name current zone as...' });
	const saveBtn = el('button', { class: 'btn', type: 'button', text: 'Save current zone' });
	saveBtn.onclick = async () => {
		const n = nameInp.value.trim();
		if (!n) return;
		try {
			const r = await getJSON('/dungeons/add?name=' + encodeURIComponent(n));
			if (!r.ok) return status('Save failed: ' + (r.error || 'unknown'), true);
			S.dungeons = { dungeons: r.dungeons };
			nameInp.value = '';
			status('Saved "' + n + '" = zone ' + S.game.zone);
			paint();
		} catch (e) {
			status('Save failed: ' + e.message, true);
		}
	};
	box.append(el('div', { class: 'controls' }, nameInp, saveBtn));

	let custom = null;
	function paint() {
		const q = search.value.trim().toLowerCase();
		list.textContent = '';
		let shown = 0;
		for (const d of S.dungeons.dungeons || []) {
			if (q && String(d.name).toLowerCase().indexOf(q) === -1) continue;
			shown++;
			const opt = el('button', { class: 'opt', type: 'button' },
				el('span', { class: 'name', text: d.note ? d.name + ' - ' + d.note : d.name }),
				el('span', { class: 'id', text: 'contId ' + d.contId })
			);
			opt.onclick = () => send('enter_dungeon ' + d.contId + ' ' + (idx.value || '0'), opt);
			list.append(opt);
		}
		if (custom) {
			const opt = el('button', { class: 'opt', type: 'button' },
				el('span', { class: 'name', text: custom.name }),
				el('span', { class: 'id', text: 'contId ' + custom.contId + ' (current)' })
			);
			opt.onclick = () => send('enter_dungeon ' + custom.contId + ' ' + (idx.value || '0'), opt);
			list.append(opt);
			shown++;
		}
		if (!shown) {
			list.append(el('div', { class: 'empty', text: 'No match. Enter one in game, then "Save current zone".' }));
		}
	}
	search.oninput = paint;
	paint();
}

// ---------- item search -> makeitems ----------
function renderItemSearch(box) {
	const q = el('input', { type: 'text', class: 'grow', 'aria-label': 'Search item names', placeholder: 'Search item names...' });
	const btn = el('button', { class: 'btn', type: 'button', text: 'Search' });
	box.append(el('div', { class: 'controls' }, q, btn));

	// Selected items shown as removable chips so the pending command is visible.
	const chips = el('div', { class: 'chips' });
	box.append(chips);

	const qtyInp = el('input', { type: 'text', class: 'num', 'aria-label': 'Quantity', value: '1' });
	const sendSel = el('button', { class: 'btn', type: 'button', text: 'Makeitems selected' });
	sendSel.onclick = () => {
		if (!S.selectedItems.length) return status('No items selected', true);
		send('makeitems ' + S.selectedItems.join(' ') + ' ' + (qtyInp.value || '1'), sendSel);
	};
	const clearSel = el('button', { class: 'btn', type: 'button', text: 'Clear' });
	clearSel.onclick = () => {
		S.selectedItems = [];
		paintChips();
		// Uncheck every individual item checkbox still shown in the view.
		list.querySelectorAll('tr.pick').forEach(row => {
			row.className = 'pick';
			row.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; });
		});
	};
	box.append(el('div', { class: 'controls' }, qtyInp, sendSel, clearSel));

	const list = el('div', { class: 'list' });
	box.append(list);

	function paintChips() {
		chips.textContent = '';
		for (const id of S.selectedItems) {
			const x = el('button', { class: 'x', type: 'button', 'aria-label': 'Remove item ' + id, text: '×' });
			x.onclick = () => {
				S.selectedItems = S.selectedItems.filter(v => v !== id);
				paintChips();
			};
			chips.append(el('span', { class: 'chip' }, el('span', { text: String(id) }), x));
		}
	}

	q.onkeydown = e => { if (e.key === 'Enter') btn.click(); };
	btn.onclick = async () => {
		const term = q.value.trim();
		if (term.length < 2) return;
		list.textContent = '';
		list.append(el('div', { class: 'empty', text: 'searching...' }));
		try {
			const res = await getJSON('/items?q=' + encodeURIComponent(term));
			list.textContent = '';
			if (!res.length) {
				list.append(el('div', { class: 'empty', text: 'No items matched "' + term + '"' }));
				return;
			}
			// Two-column table so every result is exactly one row: name left, id right.
			const table = el('table', { class: 'picks' });
			for (const it of res) {
				const cb = el('input', { type: 'checkbox' });
				cb.checked = S.selectedItems.indexOf(it.id) !== -1;
				const row = el('tr', { class: 'pick' + (cb.checked ? ' active' : '') });
				cb.onchange = () => {
					const at = S.selectedItems.indexOf(it.id);
					if (cb.checked && at === -1) S.selectedItems.push(it.id);
					if (!cb.checked && at !== -1) S.selectedItems.splice(at, 1);
					row.className = 'pick' + (cb.checked ? ' active' : '');
					paintChips();
				};
				// A <label> would give click-the-row-to-toggle for free; a table
				// row does not, so re-add it (ignoring clicks on the checkbox
				// itself, which already toggled).
				row.onclick = e => {
					if (e && e.target === cb) return;
					cb.checked = !cb.checked;
					cb.onchange();
				};
				row.append(
					el('td', { class: 'nm' }, cb, el('span', { text: it.name })),
					el('td', { class: 'id', text: String(it.id) })
				);
				table.append(row);
			}
			list.append(table);
		} catch (e) {
			list.textContent = '';
			list.append(el('div', { class: 'empty', text: 'Search failed' }));
		}
	};
	paintChips();
}

// ---------- gear sets (from the spreadsheet) ----------
function renderGearsets(box) {
	const filters = {};
	const filterInputs = {};
	const row = el('div', { class: 'controls' });
	for (const f of S.gearsets.filters || []) {
		filters[f.key] = '';
		const inp = el('input', { type: 'text', class: 'grow', 'aria-label': f.label, placeholder: f.label });
		const onFilter = () => {
			filters[f.key] = inp.value.trim();
			paint();
		};
		inp.oninput = onFilter;
		filterInputs[f.key] = inp;
		row.append(inp);
	}
	const clearBtn = el('button', { class: 'btn', type: 'button', text: 'Clear', title: 'Reset all filters' });
	clearBtn.onclick = () => {
		for (const k in filterInputs) { filterInputs[k].value = ''; filters[k] = ''; }
		paint();
	};
	row.append(clearBtn);
	box.append(row);

	const qtyInp = el('input', { type: 'text', class: 'num', 'aria-label': 'Quantity', value: '1' });
	const sendBtn = el('button', { class: 'btn', type: 'button', text: 'Send' });
	sendBtn.onclick = () => { if (selected) send(previewCmd, sendBtn); };
	const count = el('span', { class: 'dim' });
	box.append(el('div', { class: 'controls' }, count, qtyInp, sendBtn));

	const preview = el('div', { class: 'preview', text: 'Select a gear set.' });
	box.append(preview);
	const names = el('div', { class: 'names' });
	box.append(names);

	const list = el('div', { class: 'list' });
	box.append(list);

	let selected = null;
	let previewCmd = null;

	function refreshPreview() {
		if (!selected) {
			preview.textContent = 'Select a gear set.';
			previewCmd = null;
			names.textContent = '';
			return;
		}
		previewCmd = 'makeitems ' + selected.items.join(' ') + ' ' + (qtyInp.value || '1');
		preview.textContent = previewCmd;
		showItemNames(selected.items);
	}

	function showItemNames(ids) {
		names.textContent = 'resolving names...';
		getJSON('/names?ids=' + ids.join(',')).then(map => {
			const slots = S.gearsets.slotNames || [];
			const parts = ids.map((id, i) => (slots[i] ? slots[i] + ': ' : '') + (map[id] || id));
			names.textContent = parts.join(' | ');
		}).catch(() => { names.textContent = ''; });
	}

	function paint() {
		list.textContent = '';
		const sets = S.gearsets.sets || [];
		const matches = sets.filter(s => {
			for (const k in filters) {
				const q = filters[k];
				if (q && !matchesWords(s[k], q)) return false;
			}
			return true;
		});
		const total = sets.length;
		count.textContent = matches.length + (matches.length === total ? ' sets' : ' of ' + total);
		if (!matches.length) {
			list.append(el('div', { class: 'empty', text: total ? 'No gear set matches those filters.' : 'No gear sets in gearsets.json yet.' }));
			selected = null;
			refreshPreview();
			return;
		}
		for (const s of matches.slice(0, 200)) {
			const opt = el('button', { class: 'opt', type: 'button' },
				el('span', { class: 'name', text: s.name }),
				el('span', { class: 'id', text: s.items.length + ' items' })
			);
			opt.onclick = () => {
				list.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
				opt.classList.add('active');
				selected = s;
				refreshPreview();
			};
			list.append(opt);
		}
	}

	qtyInp.onchange = refreshPreview;
	paint();
}

// ---------- questing: search lines + quests, START / NEXT STEP ----------
// Quest lines are collapsible headers carrying no buttons; only the quests
// inside a line get buttons. Everything starts collapsed, so 2700 quests render
// as 41 headers instead of thousands of DOM nodes.
const questExpanded = {};
const SEARCH_CAPS = { perLine: 60, total: 200, loose: 120 };

function renderQuests(box) {
	const q = el('input', { type: 'text', class: 'grow', 'aria-label': 'Search quest lines and quests', placeholder: 'Search quest lines and quests...' });
	box.append(el('div', { class: 'controls' }, q));

	const info = el('div', { class: 'dim' });
	box.append(info);

	const list = el('div', { class: 'list' });
	box.append(list);

	const hits = (arr, term) => arr.filter(x => x.name.toLowerCase().indexOf(term) !== -1);

	function lineHeader(line, key, open, suffix) {
		const h = el('button', { class: 'qline' + (open ? ' open' : ''), type: 'button', 'aria-expanded': String(!!open) },
			el('span', { class: 'chev', text: '▸' }),
			el('span', { text: line.name }),
			el('span', { class: 'count', text: line.quests.length + ' quests' + (suffix ? ', ' + suffix : '') })
		);
		h.onclick = () => { questExpanded[key] = !questExpanded[key]; paint(); };
		return h;
	}

	function questRow(qst) {
		const bStart = el('button', { class: 'btn', type: 'button', text: 'START' });
		bStart.onclick = () => send('start_quest ' + qst.id, bStart);
		const bNext = el('button', { class: 'btn', type: 'button', text: 'NEXT STEP' });
		bNext.onclick = () => send('next_task ' + qst.id, bNext);
		return el('div', { class: 'qrow' },
			el('span', { class: 'qname', text: qst.name }),
			el('span', { class: 'qid', text: String(qst.id) }),
			el('span', { class: 'qbtns' }, bStart, bNext)
		);
	}

	function paint() {
		const term = q.value.trim().toLowerCase();
		list.textContent = '';

		if (!S.quests.counts || !S.quests.counts.quests) {
			info.textContent = S.questError ? 'Quest data unavailable: ' + S.questError : 'Loading quests...';
			return;
		}
		info.textContent = S.quests.counts.quests + ' quests · ' + S.quests.counts.lines + ' lines';

		let rendered = 0;
		for (const line of S.quests.lines) {
			const lineHit = !term || line.name.toLowerCase().indexOf(term) !== -1;
			const questHits = term ? hits(line.quests, term) : [];
			if (term && !lineHit && !questHits.length) continue;

			const key = 'L' + line.id;
			const open = questExpanded[key] || (term && (lineHit || questHits.length));
			list.append(lineHeader(line, key, open,
				(term && !lineHit && questHits.length) ? questHits.length + ' matching' : ''));

			if (!open) continue;
			const show = (term && !lineHit) ? questHits : line.quests;
			const cap = Math.min(show.length, term ? SEARCH_CAPS.perLine : show.length);
			for (let k = 0; k < cap && rendered < SEARCH_CAPS.total; k++) {
				list.append(questRow(show[k]));
				rendered++;
			}
			if (show.length > cap) list.append(el('div', { class: 'qnote', text: '+' + (show.length - cap) + ' more in this line' }));
		}

		// Quests in no line. Hidden entirely while searching if nothing matches.
		if (S.quests.loose.length) {
			const looseHits = term ? hits(S.quests.loose, term) : S.quests.loose;
			if (!term || looseHits.length) {
				const key = 'loose';
				const open = questExpanded[key] || (term && looseHits.length);
				const lh = el('button', { class: 'qline' + (open ? ' open' : ''), type: 'button', 'aria-expanded': String(!!open) },
					el('span', { class: 'chev', text: '▸' }),
					el('span', { text: 'Other quests' }),
					el('span', { class: 'count', text: S.quests.loose.length + (term ? ' / ' + looseHits.length + ' matching' : '') })
				);
				lh.onclick = () => { questExpanded[key] = !questExpanded[key]; paint(); };
				list.append(lh);

				if (open) {
					const showLoose = term ? looseHits : S.quests.loose;
					const lcap = Math.min(showLoose.length, SEARCH_CAPS.loose);
					for (let m = 0; m < lcap; m++) list.append(questRow(showLoose[m]));
					if (showLoose.length > lcap)
						list.append(el('div', { class: 'qnote', text: '+' + (showLoose.length - lcap) + ' more - keep typing to narrow' }));
				}
			}
		}

		if (!list.children.length) {
			list.append(el('div', { class: 'empty', text: 'No quest or line matches "' + term + '"' }));
		}
	}

	q.oninput = paint;
	paint();
}

// ---------- item id logger ----------
// The mod hooks the hover tooltip (C_SHOW_ITEM_TOOLTIP_EX, type 20) and keeps
// the item ids it saw. This widget shows them and can create the picked one.
let paintItemLog = null;

function renderItemLog(box, item) {
	const node = el('div', { class: 'logbox' });
	const opts = S.itemLog.options || {};

	const chatCb = el('input', { type: 'checkbox', 'aria-label': 'Log to chat' });
	chatCb.checked = !!opts.chat;
	const panelCb = el('input', { type: 'checkbox', 'aria-label': 'Log to the panel' });
	panelCb.checked = opts.panel !== false;

	const setOption = async (key, value) => {
		try {
			const r = await getJSON('/items/log/option?key=' + key + '&value=' + (value ? 1 : 0));
			if (!r.ok) return status('Item logger: ' + (r.error || 'failed'), true);
			S.itemLog.options = r.options;
		} catch (e) {
			status('Item logger: ' + e.message, true);
		}
	};
	chatCb.onchange = () => setOption('chat', chatCb.checked);
	panelCb.onchange = () => setOption('panel', panelCb.checked);

	node.append(el('div', { class: 'controls' },
		el('label', { class: 'chain-item' }, chatCb, el('span', { text: 'Log to chat' })),
		el('label', { class: 'chain-item' }, panelCb, el('span', { text: 'Log to panel' }))
	));

	const search = el('input', { type: 'text', class: 'grow', 'aria-label': 'Search logged items', placeholder: 'search logged items...' });
	const list = el('div', { class: 'list' });
	node.append(el('div', { class: 'controls' }, search), list);

	const qty = el('input', { type: 'text', class: 'num', 'aria-label': 'How many to create', value: '1' });
	const one = el('button', { class: 'btn', type: 'button', text: 'Create one' });
	const many = el('button', { class: 'btn', type: 'button', text: 'Create X' });
	const create = n => {
		if (!S.itemLog.selected) return status('Pick an item in the list first', true);
		send('makeitems ' + S.itemLog.selected.id + ' ' + n, null);
	};
	one.onclick = () => create(1);
	many.onclick = () => create(parseInt(qty.value, 10) || 1);
	node.append(el('div', { class: 'controls' }, one, many, qty));

	const table = el('table', { class: 'picks' });
	list.append(table);

	const paint = () => {
		chatCb.checked = !!(S.itemLog.options || {}).chat;
		panelCb.checked = (S.itemLog.options || {}).panel !== false;

		const q = search.value.trim().toLowerCase();
		table.textContent = '';
		let shown = 0;
		for (const it of S.itemLog.items) {
			if (q && String(it.name || '').toLowerCase().indexOf(q) === -1 && String(it.id).indexOf(q) === -1) continue;
			if (++shown > 40) break;
			const picked = S.itemLog.selected && S.itemLog.selected.id === it.id;
			const row = el('tr', { class: 'pick' + (picked ? ' active' : '') });
			row.append(
				el('td', { class: 'nm' }, el('span', { text: it.name || ('id ' + it.id) })),
				el('td', { class: 'id', text: String(it.id) })
			);
			row.onclick = () => { S.itemLog.selected = it; paint(); };
			table.append(row);
		}
		if (!shown) {
			table.append(el('tr', {}, el('td', { class: 'nm', colspan: '2' },
				el('span', { class: 'dim', text: S.itemLog.items.length ? 'No match' : 'Hover an item in the game' }))));
		}
	};
	search.oninput = paint;
	paintItemLog = paint;
	paint();
	if (box) box.append(node);
	return node;
}

// ---------- search filter ----------
function applyFilter() {
	const q = $('#search').value.trim().toLowerCase();
	const leaves = document.querySelectorAll('.item[data-search]');
	for (const it of leaves) {
		it.style.display = (!q || it.dataset.search.indexOf(q) !== -1) ? '' : 'none';
	}
	// A group is visible when any of its children is.
	for (const group of document.querySelectorAll('.item.group')) {
		const any = [...group.querySelectorAll('.item[data-search]')].some(c => c.style.display !== 'none');
		group.style.display = any ? '' : 'none';
	}
	for (const sec of document.querySelectorAll('.sec')) {
		const any = [...sec.querySelectorAll('.item[data-search]')].some(c => c.style.display !== 'none');
		sec.style.display = any ? '' : 'none';
	}
}

// ---------- reset ----------
async function resetAll() {
	// The action clears the auto actions too (auto revive), so the response
	// carries the new state - no extra round trip.
	const r = await doAction('reset');
	if (r && r.ok) syncAuto(r.auto);
}

// ---------- boot ----------
// The first visible match, so Enter in the search can jump straight to it.
function firstVisibleMatch() {
	return [...document.querySelectorAll('.item[data-search]')].find(it =>
		it.style.display !== 'none' &&
		it.closest('.sec') && it.closest('.sec').style.display !== 'none');
}

window.addEventListener('DOMContentLoaded', () => {
	const search = document.getElementById('search');
	search.focus();

	// "/" jumps to search from anywhere in the menu (unless already typing).
	document.addEventListener('keydown', e => {
		const tag = (e.target && e.target.tagName) || '';
		if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
			e.preventDefault();
			search.focus();
			search.select();
		}
	});

	// Enter jumps to the first match, Escape clears the filter.
	search.addEventListener('keydown', e => {
		if (e.key === 'Escape') {
			search.value = '';
			applyFilter();
			return;
		}
		if (e.key !== 'Enter') return;
		const first = firstVisibleMatch();
		if (!first) return;
		first.scrollIntoView({ block: 'center' });
		const btn = first.querySelector('button');
		// Focus on the next tick: moving the focus during the keypress would
		// hand the Enter key to the new button and press it.
		if (btn) setTimeout(() => btn.focus(), 0);
	});
	search.addEventListener('input', applyFilter);

	document.getElementById('btn-mini').onclick = () => setMini(!S.mini);
	document.getElementById('btn-close').onclick = () => {
		const api = tauriApi();
		if (!api) return status('Close only works in the overlay window', true);
		api.window.getCurrentWindow().close();
	};

	// ?mini=1 opens the strip directly - handy in a plain browser.
	if (new URLSearchParams(location.search).get('mini') === '1') setMini(true);

	loadAll();
	pollState();
	pollItemLog();
	setInterval(pollState, 3000);
	setInterval(pollItemLog, 2000);
});
</script>
